<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/estilo.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: linear-gradient(to bottom, #111, #363636);
            min-height: 100vh;
        }
    </style>
</head>

<body>

<main>

    <section class="bloco-regras-unico">

        <div class="conteudo-regra">

            <h1>🔐 LOGIN</h1>

            <p>Acesse sua conta</p>

            <!-- LOGIN -->
            <input type="text" id="cpf" placeholder="CPF"
                style="width:100%; padding:10px; margin-bottom:10px;">

            <input type="password" id="senha" placeholder="Senha"
                style="width:100%; padding:10px; margin-bottom:15px;">

            <button onclick="login()" style="width:100%; padding:10px; margin-bottom:20px;">
                Entrar
            </button>

            <!-- DIVISOR -->
            <hr style="margin: 20px 0; border: 1px solid #555;">

            <!-- CADASTRO -->
            <h2>📝 Criar conta</h2>

            <input type="text" id="nomeCadastro" placeholder="Nome completo"
                style="width:100%; padding:10px; margin-bottom:10px;">

            <input type="text" id="cpfCadastro" placeholder="CPF"
                style="width:100%; padding:10px; margin-bottom:10px;">

            <input type="password" id="senhaCadastro" placeholder="Senha"
                style="width:100%; padding:10px; margin-bottom:15px;">

            <button onclick="cadastrar()" style="width:100%; padding:10px;">
                Cadastrar
            </button>

        </div>

    </section>

</main>

<!-- JS -->
<script>
function login() {
    console.log("Login clicado");
}

function cadastrar() {
    console.log("Cadastro clicado");
}
</script>

</body>
</html>
