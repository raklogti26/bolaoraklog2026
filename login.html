<div class="conteudo-regra">

<!-- LOGIN -->
<div id="loginBox">

    <h1>🔐 LOGIN</h1>
    <p>Acesse sua conta</p>

    <input type="text" id="cpf" placeholder="CPF"
        style="width:100%; padding:10px; margin-bottom:10px;">

    <input type="password" id="senha" placeholder="Senha"
        style="width:100%; padding:10px; margin-bottom:15px;">

    <button onclick="login()" style="width:100%; padding:10px;">
        Entrar
    </button>

    <p style="margin-top:15px;">
        Não tem conta?
        <span onclick="mostrarCadastro()" style="cursor:pointer; color:#FF9E18;">
            Criar conta
        </span>
    </p>

</div>

<!-- CADASTRO -->
<div id="cadastroBox" style="display:none;">

    <h1>📝 Cadastro</h1>
    <p>Crie sua conta</p>

    <input type="text" id="nomeCadastro" placeholder="Nome completo"
        style="width:100%; padding:10px; margin-bottom:10px;">

    <input type="text" id="cpfCadastro" placeholder="CPF"
        style="width:100%; padding:10px; margin-bottom:10px;">

    <input type="password" id="senhaCadastro" placeholder="Senha"
        style="width:100%; padding:10px; margin-bottom:15px;">

    <button onclick="cadastrar()" style="width:100%; padding:10px;">
        Cadastrar
    </button>

    <p style="margin-top:15px;">
        Já tem conta?
        <span onclick="mostrarLogin()" style="cursor:pointer; color:#FF9E18;">
            Voltar ao login
        </span>
    </p>

</div>

</div>

<script>
function mostrarCadastro() {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("cadastroBox").style.display = "block";
}

function mostrarLogin() {
    document.getElementById("cadastroBox").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
}

function login() {
    console.log("Login clicado");
}
</script>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "bolao2026register.firebaseapp.com",
  databaseURL: "https://bolao2026register-default-rtdb.firebaseio.com/",
  projectId: "bolao2026register",
  storageBucket: "bolao2026register.firebasestorage.app",
  messagingSenderId: "964326913063",
  appId: "1:964326913063:web:62d9a085414c032dba8a02"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

console.log("Firebase OK");

// ✅ IMPORTANTE: função precisa estar no window
window.cadastrar = async function () {

    console.log("Entrou na função cadastrar");

    const nome = document.getElementById("nomeCadastro").value;
    const cpf = document.getElementById("cpfCadastro").value;
    const senha = document.getElementById("senhaCadastro").value;

    const nomeFormatado = nome
        .toLowerCase()
        .replace(/\s+/g, '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');

    const email = nomeFormatado + "@bolaoraklog.com";

    try {

        const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
        const user = userCredential.user;

        await set(ref(db, "usuarios/" + user.uid), {
            nome: nome,
            cpf: cpf,
            email: email
        });

        alert("Cadastro concluído\n\nSeu login: " + email);

    } catch (error) {
        alert("Erro: " + error.message);
    }
};

</script>
